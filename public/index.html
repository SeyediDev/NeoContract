<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16326C" />
  <title>نئوکنتراکت | فضای قرارداد تایتان</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/product.css" />
  <link rel="stylesheet" href="/assets/fonts/vazirmatn.css" />
  <link rel="stylesheet" href="/fanasa-theme.css" />
  <link rel="stylesheet" href="/ux-workbench.css" />
  <link rel="stylesheet" href="/titan.css" />
  <link rel="icon" href="/assets/brand/fanasa-favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/assets/fonts/Vazirmatn-Fa.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <a class="skip-link" href="#viewRoot">رفتن به محتوای اصلی</a>
  <div id="app" class="app-shell">
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-identity">
          <img class="fanasa-logo fanasa-logo-sidebar" src="/assets/brand/fanasa-logo-horizontal-fa-reverse.svg" alt="فن‌آسا" width="114" height="40" />
          <div class="brand-product"><div class="brand-name">نئوکنتراکت</div><span class="brand-latin" lang="en" dir="ltr">NeoContract</span></div>
          <div class="brand-caption">تولید و مدیریت قراردادهای سازمانی</div>
        </div>
        <button class="icon-btn sidebar-close" data-action="toggle-sidebar" aria-label="بستن منو">×</button>
      </div>

      <div class="workspace-switcher">
        <div class="workspace-avatar" id="workspaceAvatar">ت</div>
        <div class="workspace-copy"><label for="tenantSelect">فضای کاری مستقل</label><strong id="workspaceLabel">در حال دریافت…</strong><select id="tenantSelect" aria-label="انتخاب فضای کاری" disabled><option>در حال دریافت…</option></select></div>
      </div>

      <div class="nav-label">کار روزانه</div>
      <nav class="main-nav" aria-label="ناوبری اصلی">
        <button class="nav-item titan-nav" data-view="titan"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 10v10M16 10v10"/></svg></span><span>برد تایتان</span><span class="nav-badge" data-nav-count="titan">۰</span></button>
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1Z"/></svg></span><span>میزکار</span></button>
        <button class="nav-item" data-view="contracts"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v5h5M9 12h6M9 16h6"/></svg></span><span>قراردادها</span><span class="nav-badge" data-nav-count="contracts">۰</span></button>
        <div class="nav-label">کتابخانه و روابط</div>
        <button class="nav-item" data-view="templates"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="14" height="16" rx="2"/><path d="M8 7h6M8 11h6M8 15h3M18 7h3v15H8v-3"/></svg></span><span>الگوهای قرارداد</span></button>
        <button class="nav-item" data-view="catalog"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h6M6 9v6M18 9v6M9 18h6"/></svg></span><span>کاتالوگ سرویس</span><span class="nav-badge" data-nav-count="catalog">۸۷</span></button>
        <button class="nav-item" data-view="customers"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8h7v13M11 21V3h9v18M2 21h20M7 11v1M7 15v1M15 7h1M15 11h1M15 15h1"/></svg></span><span>مشتریان هلدینگی</span></button>
        <button class="nav-item" data-view="managers"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2M5 21h14"/></svg></span><span>مدیران حساب</span></button>
        <button class="nav-item" data-view="processes"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="5" rx="1"/><rect x="2" y="17" width="7" height="5" rx="1"/><rect x="15" y="17" width="7" height="5" rx="1"/><path d="M12 7v5M5.5 17v-5h13v5"/></svg></span><span>الگوهای گردش کار</span></button>
        <button class="nav-item" data-view="reports"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18h17M8 17v-5M13 17V7M18 17v-8"/></svg></span><span>گزارش‌ها</span></button>
      </nav>

      <div class="nav-label nav-label-spaced">سامانه</div>
      <nav class="main-nav">
        <button class="nav-item" data-view="settings"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 2-.7 3-2 .9-2.8-.9-2 3.5 2.2 2.1v2.4l-2.2 2.1 2 3.5 2.8-.9 2 .9.7 3h4l.7-3 2-.9 2.8.9 2-3.5-2.2-2.1v-2.4l2.2-2.1-2-3.5-2.8.9-2-.9L14 2Z"/><circle cx="12" cy="12" r="3"/></svg></span><span>تنظیمات و اتصال‌ها</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="help-card">
          <div class="help-icon">?</div>
          <div><strong>راهنمای شروع</strong><span>در ۳ دقیقه آماده شوید</span></div>
          <button class="icon-btn" data-action="guide" aria-label="راهنمای شروع">›</button>
        </div>
        <div class="sidebar-user">
          <div class="user-avatar">م</div>
          <div class="user-copy"><strong>پنل مدیریتی</strong><span id="accessModeLabel">در حال دریافت فضای کاری</span></div>

        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-btn hamburger" data-action="toggle-sidebar" aria-label="باز کردن منو" aria-expanded="false" aria-controls="sidebar">☰</button>
          <div class="breadcrumb"><span>فضای کاری</span><b>/</b><strong id="breadcrumbCurrent">میزکار</strong></div>
        </div>
        <div class="topbar-actions">
          <img class="fanasa-logo fanasa-logo-topbar" src="/assets/brand/fanasa-logo-horizontal-fa-color.svg" alt="فن‌آسا" width="80" height="28" />
          <label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="جست‌وجوی قرارداد یا مشتری…" aria-label="جست‌وجوی سراسری قرارداد" /><kbd>/</kbd></label>
          <button class="icon-btn mobile-search-button" data-action="global-search" aria-label="جست‌وجوی قرارداد">⌕</button><button class="topbar-icon" aria-label="قراردادهای در حال بررسی" data-action="notifications"><span aria-hidden="true">◷</span><span id="pendingCount">۰</span></button>
          <div class="topbar-divider"></div>
          <span class="profile-pill"><span class="user-avatar small">م</span><span>پنل مدیریتی</span><span class="tag blue">دمو</span></span>
        </div>
      </header>

      <div id="viewRoot" class="view-root" tabindex="-1"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <script src="/app.js" defer></script>

</body>
</html>
