<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1d4ed8" />
  <title>نئوکنتراکت | مدیریت قرارداد گروه انتخاب</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/fanasa.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><span>ن</span></div>
        <div>
          <div class="brand-name">نئوکنتراکت</div>
          <div class="brand-caption">مدیریت قرارداد گروه انتخاب</div>
        </div>
        <button class="icon-btn sidebar-close" data-action="toggle-sidebar" aria-label="بستن منو">×</button>
      </div>

      <div class="workspace-switcher">
        <div class="workspace-avatar">گ</div>
        <div class="workspace-copy"><span>فضای کاری</span><strong>گروه انتخاب</strong></div>
        <span class="chevron">⌄</span>
      </div>

      <div class="nav-label">نمای کلی</div>
      <nav class="main-nav" aria-label="ناوبری اصلی">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span><span>داشبورد</span></button>
        <button class="nav-item" data-view="contracts"><span class="nav-icon">▣</span><span>قراردادها</span><span class="nav-badge">۲۴</span></button>
        <button class="nav-item" data-view="templates"><span class="nav-icon">▤</span><span>الگوهای قرارداد</span></button>
        <button class="nav-item" data-view="catalog"><span class="nav-icon">⌘</span><span>کاتالوگ سرویس</span><span class="nav-badge">۸۷</span></button>
        <button class="nav-item" data-view="customers"><span class="nav-icon">♧</span><span>مشتریان هلدینگی</span></button>
        <button class="nav-item" data-view="managers"><span class="nav-icon">◉</span><span>اکانت منیجرها</span></button>
        <button class="nav-item" data-view="processes"><span class="nav-icon">◈</span><span>فرآیندها</span></button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">◒</span><span>گزارش‌ها</span></button>
      </nav>

      <div class="nav-label nav-label-spaced">سامانه</div>
      <nav class="main-nav">
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>تنظیمات دمو</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="help-card">
          <div class="help-icon">?</div>
          <div><strong>راهنمای شروع</strong><span>در ۳ دقیقه آماده شوید</span></div>
          <button class="icon-btn">›</button>
        </div>
        <div class="sidebar-user">
          <div class="user-avatar">م</div>
          <div class="user-copy"><strong>محمد رضایی</strong><span>مدیر قراردادها</span></div>
          <button class="icon-btn">•••</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-btn hamburger" data-action="toggle-sidebar" aria-label="باز کردن منو">☰</button>
          <div class="breadcrumb"><span>فضای کاری</span><b>/</b><strong id="breadcrumbCurrent">داشبورد</strong></div>
        </div>
        <div class="topbar-actions">
          <label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="جست‌وجوی قرارداد، طرف قرارداد..." /><kbd>/</kbd></label>
          <button class="topbar-icon has-dot" aria-label="اعلان‌ها" data-action="notifications">♧</button>
          <div class="topbar-divider"></div>
          <button class="profile-pill"><span class="user-avatar small">م</span><span>محمد رضایی</span><span class="chevron">⌄</span></button>
        </div>
      </header>

      <div id="viewRoot" class="view-root"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <script src="/app.js" defer></script>
  <script src="/fanasa.js" defer></script>
</body>
</html>
