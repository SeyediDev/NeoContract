name: NeoContract deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: deployment target
        required: true
        type: choice
        options: [staging, production]
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd '${{ secrets.VPS_APP_DIR }}'
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            compose=(docker compose --env-file .env -f docker-compose.production.yml)
            if [ -f compose.https.yml ]; then compose+=(-f compose.https.yml); fi
            "${compose[@]}" build app
            "${compose[@]}" run --rm --no-deps --user 0:0 -v "$PWD/.env:/run/neocontract.env:ro" app node --env-file=/run/neocontract.env scripts/validate-production-env.mjs
            "${compose[@]}" pull postgres oauth2-proxy
            "${compose[@]}" up -d --wait --wait-timeout 120 postgres app oauth2-proxy
            "${compose[@]}" ps
